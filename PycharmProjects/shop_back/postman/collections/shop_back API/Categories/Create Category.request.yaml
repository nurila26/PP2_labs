$kind: http-request
name: Create Category
method: POST
url: '{{baseUrl}}/api/categories/'
order: 2000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  - key: Authorization
    value: 'Token {{token}}'
    disabled: true
body:
  type: json
  content: |-
    {
      "name": "Electronics"
    }
description: Creates a new category. POST /api/categories/
