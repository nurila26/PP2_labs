$kind: http-request
name: Update Category
method: PUT
url: '{{baseUrl}}/api/categories/{{categoryId}}/'
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  - key: Authorization
    value: 'Token {{token}}'
    disabled: true
body:
  type: json
  content: |-
    {
      "name": "Updated Electronics"
    }
description: Fully updates a category by ID. PUT /api/categories/{id}/
