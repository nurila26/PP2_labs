$kind: http-request
name: Partial Update Product
method: PATCH
url: '{{baseUrl}}/api/products/{{productId}}/'
order: 5000
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
  - key: Authorization
    value: 'Token {{token}}'
    disabled: true
body:
  type: json
  content: |-
    {
      "price": 899.99,
      "is_active": false
    }
description: Partially updates a product by ID. PATCH /api/products/{id}/
